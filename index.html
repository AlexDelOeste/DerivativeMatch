<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derivative Match</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}.game{max-width:1000px;margin:28px auto;padding:26px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0002}h1{text-align:center;margin:0 0 6px;color:#273c75}.instructions{text-align:center;color:#666;margin-bottom:18px}.scoreboard{display:flex;justify-content:center;gap:28px;font-weight:bold;background:#f7f7f7;padding:12px;border-radius:10px;margin-bottom:22px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}.column h2{text-align:center;font-size:18px}.card{background:#eef2f7;border:2px solid transparent;border-radius:10px;padding:14px;margin:10px 0;text-align:center;font-size:21px;cursor:pointer;transition:.15s;user-select:none;min-height:55px;display:flex;align-items:center;justify-content:center}.card:hover{transform:translateY(-2px);border-color:#718093}.selected{background:#dfe6e9;border-color:#273c75}.correct{background:#d4edda;border-color:#28a745;cursor:default;opacity:.72}.wrong{background:#f8d7da;border-color:#dc3545}#message{min-height:30px;text-align:center;font-weight:bold;margin-top:18px;font-size:18px}button{display:block;margin:16px auto 0;padding:12px 22px;border:0;border-radius:8px;background:#273c75;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:hover{background:#192a56}.small{text-align:center;color:#777;font-size:13px;margin-top:10px}@media(max-width:650px){.game{margin:10px;padding:16px}.columns{grid-template-columns:1fr;gap:8px}.card{font-size:19px}}</style></head><body><div class="game"><h1>Derivative Match</h1><div class="instructions">Selecciona una función y después su derivada correcta.</div><div class="scoreboard"><span>Aciertos: <span id="score">0</span>/<span id="total">10</span></span><span>Intentos fallidos: <span id="errors">0</span></span></div><div class="columns"><div class="column"><h2>Función</h2><div id="functions"></div></div><div class="column"><h2>Derivada</h2><div id="derivatives"></div></div></div><div id="message"></div><button id="newGame">Jugar de nuevo</button><div class="small">Cada partida genera funciones, coeficientes y exponentes nuevos.</div></div><script>
const N=10;let sf=null,sd=null,score=0,errors=0,problems=[];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rand(0,a.length-1)];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function coef(a){return a===1?'':a===-1?'−':String(a).replace('-','−')}function sup(n){return `<sup>${String(n).replace('-','−')}</sup>`}
function power(){let a=choice([-6,-5,-4,-3,-2,2,3,4,5,6]),n=rand(2,8);return{f:`${coef(a)}x${sup(n)}`,d:`${coef(a*n)}x${sup(n-1)}`}}function neg(){let a=choice([-6,-5,-4,-3,-2,2,3,4,5,6]),n=rand(1,5);return{f:`${coef(a)}x${sup(-n)}`,d:`${coef(-a*n)}x${sup(-n-1)}`}}function root(){let a=choice([2,4,6,8,10]);return{f:`${a}√x`,d:`${a/2}/√x`}}function sine(){let a=rand(2,6),k=rand(2,6);return{f:`${a}sin(${k}x)`,d:`${a*k}cos(${k}x)`}}function cosine(){let a=rand(2,6),k=rand(2,6);return{f:`${a}cos(${k}x)`,d:`−${a*k}sin(${k}x)`}}function exponential(){let a=rand(1,5),k=rand(2,6),p=a===1?'':a;return{f:`${p}e${sup(k+'x')}`,d:`${a*k}e${sup(k+'x')}`}}function logarithm(){let a=choice([2,3,4,5,6,8]),k=rand(2,7);return{f:`${a}ln(${k}x)`,d:`${a}/x`}}const G={power,neg,root,sin:sine,cos:cosine,exp:exponential,ln:logarithm};function generate(){let types=['power','power',choice(['sin','cos']),choice(['sin','cos'])],pool=['power','power','neg','root','sin','sin','cos','cos','exp','exp','ln'];while(types.length<N)types.push(choice(pool));types=shuffle(types);let out=[],seenF=new Set,seenD=new Set;for(let t of types){let p,g=0;do{p=G[t]();g++}while((seenF.has(p.f)||seenD.has(p.d))&&g<100);seenF.add(p.f);seenD.add(p.d);out.push(p)}return out.map((p,i)=>({...p,id:i}))}function card(html,id,side){let c=document.createElement('div');c.className='card';c.innerHTML=html;c.dataset.id=id;c.onclick=()=>side==='f'?selF(c):selD(c);return c}function start(){score=errors=0;sf=sd=null;problems=generate();scoreEl.textContent=errorsEl.textContent=0;message.textContent='';functions.innerHTML=derivatives.innerHTML='';shuffle(problems).forEach(p=>functions.appendChild(card(`f(x) = ${p.f}`,p.id,'f')));shuffle(problems).forEach(p=>derivatives.appendChild(card(`f′(x) = ${p.d}`,p.id,'d')))}function selF(c){if(c.classList.contains('correct'))return;document.querySelectorAll('#functions .card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');sf=c;check()}function selD(c){if(c.classList.contains('correct'))return;document.querySelectorAll('#derivatives .card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');sd=c;check()}function check(){if(!sf||!sd)return;if(sf.dataset.id===sd.dataset.id){sf.classList.remove('selected');sd.classList.remove('selected');sf.classList.add('correct');sd.classList.add('correct');score++;scoreEl.textContent=score;message.textContent=score===N?'🎉 ¡Excelente! Completaste todas las parejas.':'✓ ¡Correcto!';sf=sd=null}else{let a=sf,b=sd;a.classList.add('wrong');b.classList.add('wrong');errors++;errorsEl.textContent=errors;message.textContent='✗ Esa pareja no corresponde. Inténtalo otra vez.';sf=sd=null;setTimeout(()=>{a.classList.remove('selected','wrong');b.classList.remove('selected','wrong')},550)}}const scoreEl=document.getElementById('score'),errorsEl=document.getElementById('errors');document.getElementById('newGame').onclick=start;start();
</script></body></html>
